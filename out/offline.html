<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Aureum Desk</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08090c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.35' cy='.3' r='.8'%3E%3Cstop offset='0' stop-color='%23fbe7a6'/%3E%3Cstop offset='.55' stop-color='%23e3b341'/%3E%3Cstop offset='1' stop-color='%238a6312'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%23fff' stroke-opacity='.35'/%3E%3C/svg%3E">
<!-- Served by sw.js when a page cannot load without a network. Self-contained: no other file is needed offline. -->
<script>
  // the Desk's theme setting (localStorage msPrefs.theme): light stays light, every other theme is dark; else the system
  (function () { try { var t = (JSON.parse(localStorage.getItem('msPrefs') || 'null') || {}).theme; if (t) document.documentElement.dataset.theme = t === 'light' ? 'light' : t === 'midnight' ? 'midnight' : 'dark'; } catch (e) {} })();
</script>
<style>
  /* the Aureum graphite look (docs/design/aureum-theme.md), inline: nothing else can load offline */
  :root { --bg: #121315; --panel: #1A1C1F; --line: rgba(255,255,255,.08); --ink: #ECEDEF; --ink-dim: #B4B8BF; --accent: #9DB4D3; --primary: #E4E6E9; --on-primary: #121315; color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]):not([data-theme="midnight"]) { --bg: #F2F3F5; --panel: #FFFFFF; --line: rgba(20,24,30,.10); --ink: #17191C; --ink-dim: #474C54; --accent: #2F5E9E; --primary: #25292E; --on-primary: #FFFFFF; color-scheme: light; } }
  :root[data-theme="light"] { --bg: #F2F3F5; --panel: #FFFFFF; --line: rgba(20,24,30,.10); --ink: #17191C; --ink-dim: #474C54; --accent: #2F5E9E; --primary: #25292E; --on-primary: #FFFFFF; color-scheme: light; }
  :root[data-theme="midnight"] { --bg: #0B0C0E; --panel: #131416; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; }
  .card { box-sizing: border-box; max-width: 420px; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 32px 24px; text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .mark { display: grid; place-items: center; width: 48px; height: 48px; margin: 0 auto 12px; border-radius: 13px; background: linear-gradient(135deg, #F4F5F7 0%, #B9BEC6 55%, #8A9099 100%); box-shadow: inset 0 0 0 1px rgba(22,24,27,.14); color: #16181B; font: 700 24px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wm { margin: 0 0 20px; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
  .wm span { font-weight: 500; letter-spacing: .22em; color: var(--ink-dim); }
  h1 { font-size: 20px; font-weight: 650; letter-spacing: -.02em; line-height: 1.35; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: var(--ink-dim); }
  button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 22px; border-radius: 8px; border: 0; background: var(--primary); color: var(--on-primary); cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="card" role="status">
    <div class="mark" aria-hidden="true">A</div>
    <p class="wm" aria-hidden="true">Aureum <span>Desk</span></p>
    <h1>You're offline — prices and trades need a connection</h1>
    <p>Aureum Desk shows live prices, trades and alerts, so nothing here is saved for offline use. This page reloads by itself when you are back online.</p>
    <button type="button" id="retry">Try again</button>
  </div>
</main>
<script>
  document.getElementById('retry').addEventListener('click', function () { location.reload(); });
  addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
