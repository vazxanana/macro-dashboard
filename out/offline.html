<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Meridian X</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08090c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.35' cy='.3' r='.8'%3E%3Cstop offset='0' stop-color='%23fbe7a6'/%3E%3Cstop offset='.55' stop-color='%23e3b341'/%3E%3Cstop offset='1' stop-color='%238a6312'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%23fff' stroke-opacity='.35'/%3E%3C/svg%3E">
<!-- Served by sw.js when a page cannot load without a network. Self-contained: no other file is needed offline. -->
<style>
  :root { --bg: #08090c; --panel: #0f1116; --line: #232833; --ink: #eceef2; --ink-dim: #a4abb8; --gold: #e3b341; --on-gold: #1a1406; color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root { --bg: #f4f6f9; --panel: #ffffff; --line: #dfe3ea; --ink: #131722; --ink-dim: #4a5160; --gold: #8a6100; --on-gold: #ffffff; color-scheme: light; } }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; }
  .card { box-sizing: border-box; max-width: 420px; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; text-align: center; }
  svg { display: block; margin: 0 auto 16px; }
  h1 { font-size: 20px; line-height: 1.35; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: var(--ink-dim); }
  button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 22px; border-radius: 10px; border: 0; background: var(--gold); color: var(--on-gold); cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="card" role="status">
    <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true"><defs><radialGradient id="g" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fbe7a6"/><stop offset=".55" stop-color="#e3b341"/><stop offset="1" stop-color="#8a6312"/></radialGradient></defs><circle cx="16" cy="16" r="14" fill="url(#g)"/><circle cx="16" cy="16" r="10.5" fill="none" stroke="#fff" stroke-opacity=".35"/></svg>
    <h1>You're offline — prices and trades need a connection</h1>
    <p>Meridian X shows live prices, trades and alerts, so nothing here is saved for offline use. This page reloads by itself when you are back online.</p>
    <button type="button" id="retry">Try again</button>
  </div>
</main>
<script>
  document.getElementById('retry').addEventListener('click', function () { location.reload(); });
  addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
