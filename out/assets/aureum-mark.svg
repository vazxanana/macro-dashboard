<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Aureum Desk">
  <title>Aureum Desk</title>
  <!-- The Aureum Desk mark (docs/design/aureum-theme.md, section 2): a rounded square (8 px radius on 28 px) in brushed
       silver, the same in every theme, with a bold capital A drawn as a path (no font needed). scripts/make-icons.mjs reads
       this file for the app icons. -->
  <defs>
    <linearGradient id="aureum-silver" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F7"/>
      <stop offset=".55" stop-color="#B9BEC6"/>
      <stop offset="1" stop-color="#8A9099"/>
    </linearGradient>
  </defs>
  <rect id="aureum-tile" width="512" height="512" rx="146.3" fill="url(#aureum-silver)"/>
  <path id="aureum-a" fill="#16181B" fill-rule="evenodd" d="M226 115H286L381 385H322L300.9 325H211.1L190 385H131ZM256 198L229.1 274H282.9Z"/>
</svg>
