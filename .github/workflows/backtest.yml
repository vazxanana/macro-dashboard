name: Council backtest

# Replays the last weeks of real candles through the Trader's engine and rules (council/backtest.mjs)
# and saves the results to council-data/backtest.json, where the Coach and the page read them.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Days of history to replay'
        default: '30'
  push:
    branches: [main]
    paths:
      - 'council/backtest.mjs'
      - 'council/engine.mjs'
      - 'council/duka.mjs'
      - 'council/yahoo.mjs'
      - 'council/krakenhist.mjs'
      - 'council/choch.mjs'
      - 'council/clean.mjs'
      - 'council/adx.mjs'
      - '.github/workflows/backtest.yml'
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: council-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: council

      - name: Checkout council data
        uses: actions/checkout@v4
        with:
          ref: council-data
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Kraken / Dukascopy history cache (per-day files). The Kraken backfill workflow (kraken-backfill.yml) fills its crypto days
      # every 30 min on the same cache line; a coin replays on Kraken as soon as its days cover the window.
      - name: Restore history cache
        uses: actions/cache/restore@v4
        with:
          path: .duka-cache
          key: duka-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: duka-

      - name: Backtest
        env:
          DUKA_CACHE: .duka-cache
        run: node council/backtest.mjs data "${{ github.event.inputs.days || '30' }}"

      # Saved even when the replay fails or is cancelled (a push to main cancels a running replay, and actions/cache saves only
      # on success, so those runs lost every Kraken day they had downloaded). The backfill may have saved a newer copy meanwhile:
      # restore it beside ours and merge (council/krakenfill.mjs --merge), so neither run's days are lost.
      - name: Set the history cache aside
        id: aside
        if: always()
        run: mv .duka-cache .duka-mine 2>/dev/null || mkdir -p .duka-mine

      - name: Restore the newest saved cache
        if: always() && steps.aside.outcome == 'success'
        uses: actions/cache/restore@v4
        with:
          path: .duka-cache
          key: duka-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: duka-

      - name: Merge the history caches
        if: always() && steps.aside.outcome == 'success'
        run: mkdir -p .duka-cache && node council/krakenfill.mjs --merge .duka-mine .duka-cache

      - name: Save history cache
        if: always() && steps.aside.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .duka-cache
          key: duka-${{ github.run_id }}-${{ github.run_attempt }}

      # Replay fidelity: the replay's signals and outcomes against the live Trader's on the same days (no network)
      - name: Replay fidelity
        run: node council/fidelity.mjs data || true

      # Spot check: the live Trader's closed gold/forex trades re-judged on OANDA spot candles (Kraken forex books are thin)
      - name: Spot check
        run: node council/spotcheck.mjs data || true

      - name: Save results
        run: |
          git -C data config user.name "mosha-council"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C data add backtest.json
          git -C data add research/fidelity.json || true
          git -C data add research/spotcheck.json || true
          git -C data commit -q -m "Council backtest $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for j in 1 2 3 4 5; do git -C data pull -q --rebase origin council-data && git -C data push -q origin HEAD:council-data && break; sleep 7; done

  # Robustness audit (research/robustness.mjs): walk-forward, bootstrap, costs x1.5/x2, Monte Carlo drawdown and multiple-testing
  # checks of every edge claim, refreshed after the nightly replay. Report only (council-data research/robustness.json + .md):
  # it changes no rule, and a failure here never fails the backtest job.
  robustness:
    needs: backtest
    if: ${{ !cancelled() }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research
            council

      - name: Checkout council data (only the files the audit reads)
        uses: actions/checkout@v4
        with:
          ref: council-data
          path: data
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backtest.json
            /config.json
            /ict/replay.json
            /research/replay-2w.json
            /research/backtest-150d.json
            /research/backtest-150d-clean.json
            /research/log.md
            /research/robustness.json
            /research/robustness.md

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Robustness audit
        run: node research/robustness.mjs data --out data/research

      - name: Save results
        run: |
          git -C data config user.name "mosha-council"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C data add research/robustness.json research/robustness.md
          git -C data commit -q -m "Robustness audit $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for j in 1 2 3 4 5; do git -C data pull -q --rebase origin council-data && git -C data push -q origin HEAD:council-data && break; sleep 7; done
