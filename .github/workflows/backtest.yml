name: Council backtest

# RESEARCH BRANCH ONLY (council-research, never merged). Runs on every push to this branch (or by hand).
# Replays a long period (default 150 days) one market per job, then merges the trades into
# council-data/research/backtest-<days>d-pf.json (with close times and time-stop variants for the portfolio replay). It never writes backtest.json, so the Coach's live rules are untouched.
on:
  push:
    branches: [council-research]
  workflow_dispatch:
    inputs:
      days:
        description: 'Days of history to replay'
        default: '150'

permissions:
  contents: write

concurrency:
  group: council-research-vrdbg
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        market: [xau, btc, eth, sol, xrp, eurusd, gbpusd, audusd, usdcad, usdchf]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: council

      - name: Checkout council data
        uses: actions/checkout@v4
        with:
          ref: council-data
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore forex history cache
        uses: actions/cache@v4
        with:
          path: .duka-cache
          key: duka-research-${{ matrix.market }}-${{ github.run_id }}
          restore-keys: |
            duka-research-${{ matrix.market }}-
            duka-

      - name: Backtest ${{ matrix.market }}
        env:
          DUKA_CACHE: .duka-cache
          BT_MARKETS: ${{ matrix.market }}
          KRAKEN_BUDGET: '400'
        run: |
          mkdir -p bt && cp data/config.json bt/
          node council/backtest.mjs bt "${{ github.event.inputs.days || '150' }}" 2>&1 | tail -60

      - name: Save this market's part to council-data
        run: |
          DAYS="${{ github.event.inputs.days || '150' }}"
          mkdir -p data/research/parts
          cp bt/backtest.json "data/research/parts/${DAYS}d-vrdbg-${{ matrix.market }}.json"
          git -C data config user.name "mosha-council"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C data add research/parts
          git -C data commit -q -m "Research backtest part ${{ matrix.market }} ${DAYS}d" || exit 0
          for j in 1 2 3 4 5 6 7 8; do git -C data pull -q --rebase origin council-data && git -C data push -q origin HEAD:council-data && break; sleep $((j * 5)); done

      - uses: actions/upload-artifact@v4
        with:
          name: bt-${{ matrix.market }}
          path: bt/backtest.json
          retention-days: 7

  merge:
    needs: backtest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout council data
        uses: actions/checkout@v4
        with:
          ref: council-data
          path: data

      - uses: actions/download-artifact@v4
        with:
          pattern: bt-*
          path: parts

      - name: Merge and save
        run: |
          DAYS="${{ github.event.inputs.days || '150' }}"
          mkdir -p data/research
          node -e '
            const fs = require("fs"), days = process.argv[1];
            const out = { at: null, days: +days, from: null, to: null, fake: false, cfg: null, tradeCols: null, markets: {}, coverage: {}, source: {}, errors: {}, trades: [] };
            for (const d of fs.readdirSync("parts").sort()) {
              const b = JSON.parse(fs.readFileSync(`parts/${d}/backtest.json`, "utf8")), m = d.replace(/^bt-/, "");
              if (!out.tradeCols) out.tradeCols = b.tradeCols;
              if (JSON.stringify(out.tradeCols) !== JSON.stringify(b.tradeCols)) throw new Error(`columns differ for ${m}`);
              Object.assign(out, { at: b.at, from: b.from, to: b.to, cfg: b.cfg });
              out.markets[m] = b.markets[m] || null;
              Object.assign(out.coverage, (b.markets || {}).coverage || {});
              Object.assign(out.source, (b.markets || {}).source || {});
              Object.assign(out.errors, (b.markets || {}).errors || {});
              out.cleaned = Object.assign(out.cleaned || {}, (b.markets || {}).cleaned || {});
              out.trades.push(...b.trades);
            }
            fs.writeFileSync(`data/research/backtest-${days}d-vrdbg.json`, JSON.stringify(out));
            console.log(`${out.trades.length} rows from ${Object.keys(out.markets).length} markets`, out.coverage, out.errors);
          ' "$DAYS"
          git -C data config user.name "mosha-council"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C data add research
          git -C data commit -q -m "Research backtest ${DAYS}d $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for j in 1 2 3 4 5; do git -C data pull -q --rebase origin council-data && git -C data push -q origin HEAD:council-data && break; sleep 7; done
