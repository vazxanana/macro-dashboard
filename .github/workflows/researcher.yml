name: Researcher (ten workers, research only)

# research/edge/auto-researcher (PREREGISTRATION.md): nine seeded searchers over rule combinations on H1 OANDA candles, three
# stages (search 2005-14, validate 2015-19, holdout 2020 on), every try counted, results in council-data research/auto/. Paper
# research only: nothing is traded, alerted or copied and no council member reads the files. Free runner minutes (public
# repository). Each worker runs four processes on its 4-core runner and keeps itself alive like the council loop: a run works for about 5.5 hours, saves, then dispatches
# its own next run (workflow_dispatch from GITHUB_TOKEN is allowed). To stop: cancel the runs (a cancelled run never
# dispatches) or set the repository variable RESEARCHER_OFF to 1.
on:
  workflow_dispatch:
    inputs:
      worker:
        description: 'A worker number 1-12 (10 = NQ only, 11 and 12 = market structure; 7 and 9 now start 11 and 12), or all'
        required: false
        default: 'all'
      shard:
        description: 'Only this shard (0, 1 or 2), or 0 and 1 when empty. Shard 2 (lanes 8-11) is a third runner for workers 1, 2 and 10 on GitHub and for 3, 4, 5 and 6 on the laptop; from 25 Nov 2026 (owner: keep the 3 extra going) it chains itself like shard 0'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

env:
  MD_BASE: ${{ format('{0}/md/', vars.MD_ORIGIN || 'https://aureumdesk.co.uk') }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      workers: ${{ steps.p.outputs.workers }}
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - id: p
        env:
          W: ${{ inputs.worker }}
          SH: ${{ inputs.shard }}
        run: |
          case "$SH" in 0|1|2) echo "shards=[$SH]" >> "$GITHUB_OUTPUT" ;; *) echo 'shards=[0,1]' >> "$GITHUB_OUTPUT" ;; esac
          case "$W" in
            1|2|3|4|5|6|8|10|11|12) echo "workers=[$W]" >> "$GITHUB_OUTPUT" ;;
            # 26 Nov 2026: workers 7 and 9 (duplicates of 5 / 6 and of 3) stopped drawing; their chains hand their runners to the two
            # market-structure workers (PREREGISTRATION.md, "Two market-structure workers"), so the job count stays the same
            7) echo 'workers=[11]' >> "$GITHUB_OUTPUT" ;;
            9) echo 'workers=[12]' >> "$GITHUB_OUTPUT" ;;
            *) echo 'workers=[1,2,3,4,5,6,8,10,11,12]' >> "$GITHUB_OUTPUT" ;;
          esac

  work:
    needs: plan
    if: vars.RESEARCHER_OFF != '1'
    # shard 2 of workers 3, 4, 5 and 6 runs on the owner's laptop (self-hosted runners labelled `research`, 25 Nov 2026: "Start with 3");
    # everything else stays on GitHub's runners. A laptop job waits in the queue while the laptop is off.
    runs-on: ${{ (matrix.shard == 2 && contains('3,4,5,6', format('{0}', matrix.worker))) && fromJSON('["self-hosted","research"]') || 'ubuntu-latest' }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.plan.outputs.workers) }}
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
        exclude:
          # a second runner (lanes 4-7) for seven workers: 17 research jobs in all, so the council loop and CI always find a free runner (a free plan allows 20 at once)
          - { worker: 11, shard: 1 }
          - { worker: 8, shard: 1 }
          - { worker: 12, shard: 1 }
          # shard 2 (lanes 8-11) only for workers 1, 2 and 10, started by hand once, then chaining itself (owner, 25 Nov 2026: use the 3 spare slots, then keep them going)
          - { worker: 11, shard: 2 }
          - { worker: 8, shard: 2 }
          - { worker: 12, shard: 2 }
    concurrency:
      group: researcher-${{ matrix.worker }}-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      # root files (package.json) come with cone mode; naming a file here fails on a runner that keeps its checkout (the laptop)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/edge
            council
            api
            scripts

      - name: Checkout council data (the researcher's folder only)
        uses: actions/checkout@v4
        with:
          ref: council-data
          path: data
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/auto/*

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: The job's own OANDA candles (falls back to the website's proxy)
        env:
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
          OANDA_ENV: ${{ secrets.OANDA_ENV }}
        run: sh scripts/own-candles.sh

      - name: Search
        env:
          W: ${{ matrix.worker }}
          SHARD: ${{ matrix.shard }}
          RESEARCH_CACHE: ${{ runner.temp }}/auto-cache
        run: |
          git -C data config user.name "mosha-council"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/research/auto
          NEED=10; case "$W" in 10) NEED=1 ;; 11|12) NEED=11 ;; esac   # candle files lane 0 writes before the other lanes start
          end=$(( $(date +%s) + 19200 ))   # 320 minutes
          while [ $(( end - $(date +%s) )) -gt 1800 ]; do
            # four processes a runner (a 4-core machine ran one): lane 0 is the worker's own file, lanes 1-3 add worker-<W>-<lane>.json
            for L0 in 0 1 2 3; do
              L=$(( SHARD * 4 + L0 ))   # shard 0 lanes 0-3, shard 1 lanes 4-7, shard 2 lanes 8-11
              if [ "$L0" != 0 ]; then
                # the other lanes start once lane 0 has the candle files (up to 15 minutes; auto-4 reads M15, 28 Nov 2026), so they never read a half-written file
                n=0; while [ "$(ls "$RESEARCH_CACHE"/*-15m.json.gz 2>/dev/null | wc -l)" -lt "$NEED" ] && [ $n -lt 90 ]; do sleep 10; n=$((n+1)); done
              fi
              LANE=$L node --max-old-space-size=2500 research/edge/auto-researcher/engine.mjs run "$W" data/research/auto 25 > "$RUNNER_TEMP/lane-$L.log" 2>&1 &
            done
            wait
            tail -n 2 "$RUNNER_TEMP"/lane-*.log
            node council/datasync.mjs data save "Researcher worker $W $(date -u +%Y-%m-%dT%H:%MZ)" research/auto || echo "save failed"
          done

      - name: Next run (shard 2 chains itself, owner 25 Nov 2026 - keep the 3 extra going)
        if: matrix.shard == 2 && success() && vars.RESEARCHER_OFF != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          W: ${{ matrix.worker }}
        # curl, not gh: the laptop's Ubuntu has no gh
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/researcher.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"worker\":\"$W\",\"shard\":\"2\"}}" || echo "next run not dispatched"

      - name: Next run (shard 0 only, it starts both shards)
        if: matrix.shard == 0 && success() && vars.RESEARCHER_OFF != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          W: ${{ matrix.worker }}
        run: gh workflow run researcher.yml --ref main -R "${{ github.repository }}" -f worker="$W" || echo "next run not dispatched"
