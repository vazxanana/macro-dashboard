name: Deploy to Cloudflare

# The site (out/) and the api/ functions as one Cloudflare Worker (wrangler.toml, cf/worker.mjs); docs/cloudflare.md.
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them the run says so and stops green.

on:
  push:
    branches: [main]
    paths:
      - 'out/**'
      - 'api/**'
      - 'cf/**'
      - 'ict/**'
      - 'council/events.mjs'
      - 'council/engine.mjs'
      - 'wrangler.toml'
      - 'package.json'
      - 'academy/**'
      - 'ml/models/index.json'
      - '.github/workflows/cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: wrangler@4.140.0
    steps:
      - name: Check the Cloudflare secrets
        id: ready
        run: |
          set +x
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::notice title=Cloudflare not set up yet::Add the repository secrets:$missing (Settings -> Secrets and variables -> Actions). See docs/cloudflare.md. Nothing was deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the functions' dependencies
        if: steps.ready.outputs.ok == 'true'
        run: npm ci --no-audit --no-fund

      - name: Create the R2 bucket if missing
        if: steps.ready.outputs.ok == 'true'
        run: |
          set +x
          if npx --yes "$WRANGLER" r2 bucket create meridianx-blob > r2.log 2>&1; then
            echo "R2 bucket meridianx-blob created."
          elif grep -qiE 'already exists|already own|10004' r2.log; then
            echo "R2 bucket meridianx-blob already exists."
          else
            cat r2.log
            echo "::warning::Could not create the R2 bucket meridianx-blob (see above). The deploy will say whether it can bind it."
          fi
          rm -f r2.log

      - name: Upload the Academy's data to the private bucket
        if: steps.ready.outputs.ok == 'true'
        # trade outcomes: never in the public assets (cf/academy-data.mjs reads them from R2)
        run: |
          set +x
          n=0
          for f in academy/data/*.json; do
            npx --yes "$WRANGLER" r2 object put "meridianx-blob/academy-data/$(basename "$f")" --file "$f" --content-type application/json --remote > /dev/null && n=$((n + 1))
          done
          npx --yes "$WRANGLER" r2 object put meridianx-blob/academy-data/ml-index.json --file ml/models/index.json --content-type application/json --remote > /dev/null && n=$((n + 1))
          echo "$n Academy files uploaded."

      - name: Deploy the Worker
        if: steps.ready.outputs.ok == 'true'
        run: npx --yes "$WRANGLER" deploy

      - name: Sync the Worker secrets
        if: steps.ready.outputs.ok == 'true'
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CTRADER_LINK_KEY: ${{ secrets.CTRADER_LINK_KEY }}
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
          OANDA_ENV: ${{ secrets.OANDA_ENV }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          GH_MCP_TOKEN: ${{ secrets.GH_MCP_TOKEN }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TV_WEBHOOK_KEY: ${{ secrets.TV_WEBHOOK_KEY }}
          MOSHA_ASSISTANT_KEY: ${{ secrets.MOSHA_ASSISTANT_KEY }}
          ACADEMY_LLM_KEY: ${{ secrets.ACADEMY_LLM_KEY }}
          RUN_MODE: ${{ secrets.RUN_MODE }}
          MCP_KEYS: ${{ secrets.MCP_KEYS }}
        run: |
          set +x
          set -o pipefail
          sent=0; skipped=""
          for name in SESSION_SECRET CRON_SECRET CTRADER_LINK_KEY OANDA_TOKEN OANDA_ENV GH_TOKEN GH_READ_TOKEN GH_MCP_TOKEN \
                      GH_DISPATCH_TOKEN VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY TV_WEBHOOK_KEY MOSHA_ASSISTANT_KEY ACADEMY_LLM_KEY \
                      RUN_MODE MCP_KEYS; do
            if [ -n "${!name}" ]; then
              printf '%s' "${!name}" | npx --yes "$WRANGLER" secret put "$name" > /dev/null
              echo "set $name"
              sent=$((sent + 1))
            else
              skipped="$skipped $name"
            fi
          done
          echo "$sent Worker secrets set."
          [ -z "$skipped" ] || echo "Not set in GitHub (left as they are on the Worker):$skipped"
