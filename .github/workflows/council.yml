name: Council trader

# Paper-trades every Mosha setup on all markets and runs the daily statistical
# Coach. Results go to the `council-data` branch (never main, so Pages doesn't
# redeploy every run); the market-structure page reads them.
#
# Keeps itself alive: a push/dispatch run trades every ~4 minutes for ~4.5 h (M1 signals stay fresh 12 min, so no scalp is missed),
# then dispatches the next run (workflow_dispatch from GITHUB_TOKEN is allowed),
# so the Trader runs 24/7. Cron runs are only a watchdog: they never cancel the
# loop (own concurrency group) and start a new one only if none is running, or if the
# last council save on council-data is over 20 min old (a stuck run).
on:
  # 7 Nov 2026, 16:3x: the owner chose GitHub Actions as the council runner (repo public, so minutes are free). Self-restart,
  # watchdog and push trigger are back. The Vercel cron (api/run.js) stands down while this loop has saved in the last 10 min
  # and takes over on its own if this loop stops.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'council/**'
      - '.github/workflows/council.yml'

permissions:
  contents: write
  actions: write

jobs:
  watchdog:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: council-watchdog
      cancel-in-progress: false
    steps:
      - name: Start the Trader loop if it is not running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "${{ github.repository }}" --workflow council.yml --limit 20 --json status,event \
            --jq '[.[] | select(.event != "schedule" and (.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "pending"))] | length')
          echo "Trader loop runs active: $n"
          if [ "$n" = "0" ]; then gh workflow run council.yml --ref main -R "${{ github.repository }}"; echo "Started a new loop"; exit 0; fi
          # A run can show 'in progress' and save nothing (stuck). If the last "Council run" save on council-data (Actions or the
          # Vercel fallback) is over 20 min old, start a new loop anyway: the trade job's concurrency group cancels the stuck one.
          last=$(gh api "repos/${{ github.repository }}/commits?sha=council-data&per_page=50" \
            --jq '[.[] | select(.commit.message | startswith("Council run"))][0].commit.committer.date // empty' || true)
          if [ -z "$last" ]; then echo "No council save found in the last 50 commits: leaving the running loop alone"; exit 0; fi
          age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
          echo "Last council save: $last (${age}s ago)"
          if [ "$age" -gt 1200 ]; then
            # the trade group no longer cancels in progress runs, so cancel the stuck one here before starting a fresh loop
            for id in $(gh run list -R "${{ github.repository }}" --workflow council.yml --limit 20 --json databaseId,status,event \
              --jq '.[] | select(.event != "schedule" and .status == "in_progress") | .databaseId'); do gh run cancel "$id" -R "${{ github.repository }}" || true; done
            gh workflow run council.yml --ref main -R "${{ github.repository }}"; echo "Loop is stale: cancelled it and started a new one"; fi

  trade:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # 7 Nov: a push no longer cancels a running round mid-way (five merges in a row cancelled every run, so nothing was saved
    # for 6+ min). The new run waits; the running loop sees new council code on main at its next check and hands over.
    concurrency:
      group: council
      cancel-in-progress: false
    timeout-minutes: 330
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            council
            ict
            api

      - name: Checkout council data
        uses: actions/checkout@v4
        with:
          ref: council-data
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # 22: built-in WebSocket for the cTrader demo mirror

      - name: Trade (loop)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FUT_ACCOUNT: ${{ vars.FUT_ACCOUNT }}
          FUT_RISK: ${{ vars.FUT_RISK }}
          # cTrader DEMO mirror (council/ctrader-mirror.mjs): inert unless CTRADER_MIRROR is "on"; demo accounts only
          CTRADER_MIRROR: ${{ secrets.CTRADER_MIRROR || vars.CTRADER_MIRROR }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID || vars.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET || vars.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN || vars.CTRADER_ACCESS_TOKEN }}
          CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN || vars.CTRADER_REFRESH_TOKEN }}
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID || vars.CTRADER_ACCOUNT_ID }}
          CTRADER_ENV: ${{ secrets.CTRADER_ENV || vars.CTRADER_ENV }}
          GH_TOKEN: ${{ github.token }}   # newcode(): compare this run's commit with main (read only)
        run: |
          git -C data config user.name "mosha-council"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ROUNDS=60
          # new council code on main since this run started? (council/, ict/, api/ or this workflow) -> hand over between rounds
          newcode() { f=$(gh api "repos/${{ github.repository }}/compare/${{ github.sha }}...main" --jq '.files[].filename' 2>/dev/null) || return 1
            echo "$f" | grep -qE '^(council/|ict/|api/|\.github/workflows/council\.yml)'; }
          for i in $(seq 1 $ROUNDS); do
            # 60 rounds take ~5.6 h (~5.6 min each), longer than the 330-min job timeout, so the job was killed before "Start the
            # next run" (6 Nov 05:44: 79 min with no run until the cron watchdog restarted it). Stop at 300 min so the hand-off runs.
            if [ "$SECONDS" -gt 18000 ]; then echo "Time budget reached after $((i - 1)) rounds"; break; fi
            git -C data pull -q --rebase origin council-data || true
            node council/trader.mjs data || echo "Trader round $i failed"
            # ICT desk (7 Nov): GitHub fired ict.yml's 15-min schedule only 3 times in 22 h, so the desk runs here, every 3rd
            # round (~17 min), before the mirror copies its A-setups. ict.yml keeps a manual trigger only (one writer of ict/).
            if [ $((i % 3)) -eq 1 ]; then node ict/tracker.mjs data/ict || echo "ICT round $i failed"; fi
            # Macro strategist (7 Nov, paper only): next-day odds, event playbook and scorecard → data/macro/; every 6th round
            # (~25 min), capped at 3 min; a failure never stops the loop.
            if [ $((i % 6)) -eq 1 ]; then timeout 180 node council/macro.mjs data || echo "Macro round $i failed"; fi
            # Data-quality monitor (7 Nov): the OANDA proxy, Kraken and the ICT desk's CNBC feed, every 2nd round (~11 min) → health.json
            # and one deduplicated phone alert when a feed goes bad. Read-only for the bots; never fails the round.
            if [ $((i % 2)) -eq 1 ]; then timeout 150 node council/datacheck.mjs data || echo "Data check round $i failed"; fi
            # broker symbol specs (read only): lot size, min/step lot, quote currency, conversion, spread → ctrader/symbols.json,
            # which the mirror sizes its lots with and the Trader's cost model reads spreads from
            timeout 90 node council/ctrader-symbols.mjs data || echo "cTrader symbols round $i failed"
            node council/ctrader-mirror.mjs data || echo "cTrader mirror round $i failed"
            node council/ctrader-test.mjs data || echo "cTrader test round $i failed"   # one-off demo test order, only when ctrader/test.json asks
            node council/ctrader-suite.mjs data || echo "cTrader suite round $i failed"   # demo trade test suite (latency, SL/TP, limit, cancel), only when ctrader/suite.json asks
            node council/ctrader-account.mjs data || echo "cTrader account round $i failed"   # the owner's demo account for the profile view (read only)
            # Daily owner digest (8 Nov): one phone message after the US close (from 21:15 UTC Mon-Fri) and a Sunday-evening
            # preview; deduplicated per UTC day in data/digest.json, so it does nothing on every other round. Never fails the round.
            timeout 120 node council/digest.mjs data || echo "Digest round $i failed"
            git -C data add -A
            if ! git -C data diff --cached --quiet; then
              git -C data commit -q -m "Council run $(date -u +%Y-%m-%dT%H:%MZ)"
              for j in 1 2 3; do git -C data pull -q --rebase origin council-data && git -C data push -q origin HEAD:council-data && break; sleep 5; done
            fi
            if newcode; then echo "New council code on main: handing over after round $i"; break; fi
            if [ "$i" -lt "$ROUNDS" ]; then
              for k in 1 2 3 4; do sleep 60
                # the owner's demo account every minute between rounds (owner, 7 Nov: a manual trade showed up late); saved only on a change
                node council/ctrader-account.mjs data >/dev/null 2>&1 || true
                if ! git -C data diff --quiet -- ctrader/account.json 2>/dev/null || [ -n "$(git -C data ls-files --others -- ctrader/account.json)" ]; then
                  git -C data add ctrader/account.json && git -C data commit -q -m "cTrader account $(date -u +%H:%MZ)" && \
                  for j in 1 2 3; do git -C data pull -q --rebase origin council-data && git -C data push -q origin HEAD:council-data && break; sleep 3; done
                fi
                if newcode; then echo "New council code on main: handing over after round $i"; break 2; fi
              done
            fi
          done

      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run council.yml --ref main -R "${{ github.repository }}"
