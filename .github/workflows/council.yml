name: Council trader

# Paper-trades every Mosha setup on all markets and runs the daily statistical
# Coach. Results go to the `council-data` branch (never main, so the site is not
# rebuilt every run); the market-structure page reads them.
#
# Keeps itself alive: a push/dispatch run trades every ~4 minutes for ~4.5 h (M1 signals stay fresh 12 min, so no scalp is missed),
# then dispatches the next run (workflow_dispatch from GITHUB_TOKEN is allowed),
# so the Trader runs 24/7. Cron runs are only a watchdog: they never cancel the
# loop (own concurrency group) and start a new one only if none is running, or if the
# last council save on council-data is over 20 min old (a stuck run).
on:
  # 7 Nov 2026, 16:3x: the owner chose GitHub Actions as the council runner (repo public, so minutes are free). Self-restart,
  # watchdog and push trigger are back. (The Vercel backup runner, api/run.js, was removed on 17 Nov 2026: this loop is the
  # only runner.)
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'council/**'
      - '.github/workflows/council.yml'

# The OANDA candle service the Trader, data check and Macro strategist read (council/*.mjs `MD_BASE`). Since 16 Nov 2026 the
# site runs on Cloudflare (docs/cloudflare.md) and meridianx.dev answered 402 until its domain moved, so the default is the
# Worker's own address, which keeps working after the move. The repository variable MD_ORIGIN (scheme + host, no slash)
# overrides it.
env:
  MD_BASE: ${{ format('{0}/md/', vars.MD_ORIGIN || 'https://aureum.meridianx-cloudflare.workers.dev') }}
  # The ICT tracker's paper silver market reads the same service (ict/tracker.mjs `MD_BARS`); set here, not in the tracker, so the
  # tracker's code (and the ICT replay's ruleCode) does not change for an address.
  ICT_MD_BARS: ${{ format('{0}/md/bars', vars.MD_ORIGIN || 'https://aureum.meridianx-cloudflare.workers.dev') }}

permissions:
  contents: write
  actions: write

jobs:
  watchdog:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: council-watchdog
      cancel-in-progress: false
    steps:
      - name: Start the Trader loop if it is not running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "${{ github.repository }}" --workflow council.yml --limit 20 --json status,event \
            --jq '[.[] | select(.event != "schedule" and (.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "pending"))] | length')
          echo "Trader loop runs active: $n"
          if [ "$n" = "0" ]; then gh workflow run council.yml --ref main -R "${{ github.repository }}"; echo "Started a new loop"; exit 0; fi
          # A run can show 'in progress' and save nothing (stuck). If the last "Council run" save on council-data
          # is over 20 min old, start a new loop anyway: the trade job's concurrency group cancels the stuck one.
          last=$(gh api "repos/${{ github.repository }}/commits?sha=council-data&per_page=50" \
            --jq '[.[] | select(.commit.message | startswith("Council run"))][0].commit.committer.date // empty' || true)
          if [ -z "$last" ]; then echo "No council save found in the last 50 commits: leaving the running loop alone"; exit 0; fi
          age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
          echo "Last council save: $last (${age}s ago)"
          if [ "$age" -gt 1200 ]; then
            # the trade group no longer cancels in progress runs, so cancel the stuck one here before starting a fresh loop
            for id in $(gh run list -R "${{ github.repository }}" --workflow council.yml --limit 20 --json databaseId,status,event \
              --jq '.[] | select(.event != "schedule" and .status == "in_progress") | .databaseId'); do gh run cancel "$id" -R "${{ github.repository }}" || true; done
            gh workflow run council.yml --ref main -R "${{ github.repository }}"; echo "Loop is stale: cancelled it and started a new one"; fi

  trade:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # 7 Nov: a push no longer cancels a running round mid-way (five merges in a row cancelled every run, so nothing was saved
    # for 6+ min). The new run waits; the running loop sees new council code on main at its next check and hands over.
    concurrency:
      group: council
      cancel-in-progress: false
    timeout-minutes: 330
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            council
            ict
            api
            research/edge
            research/proposals
            research/macro-veteran
            assets

      - name: Checkout council data
        uses: actions/checkout@v4
        with:
          ref: council-data
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # 22: built-in WebSocket for the cTrader demo mirror

      - name: Trade (loop)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FUT_ACCOUNT: ${{ vars.FUT_ACCOUNT }}
          FUT_RISK: ${{ vars.FUT_RISK }}
          # cTrader DEMO mirror (council/ctrader-mirror.mjs): inert unless CTRADER_MIRROR is "on"; demo accounts only
          CTRADER_MIRROR: ${{ secrets.CTRADER_MIRROR || vars.CTRADER_MIRROR }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID || vars.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET || vars.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN || vars.CTRADER_ACCESS_TOKEN }}
          CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN || vars.CTRADER_REFRESH_TOKEN }}
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID || vars.CTRADER_ACCOUNT_ID }}
          CTRADER_ENV: ${{ secrets.CTRADER_ENV || vars.CTRADER_ENV }}
          # the ONE live account (council/live.mjs, owner 27 Nov 2026): inert unless CTRADER_LIVE is "on" AND config.json live is on
          CTRADER_LIVE: ${{ secrets.CTRADER_LIVE || vars.CTRADER_LIVE }}
          CTRADER_LIVE_ACCESS_TOKEN: ${{ secrets.CTRADER_LIVE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}   # newcode(): compare this run's commit with main (read only)
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}   # council/md-proxy.mjs: the loop's own OANDA candles (empty = the website's proxy)
          OANDA_ENV: ${{ secrets.OANDA_ENV }}
        run: |
          # own OANDA candles (15 Nov 2026): with the OANDA_TOKEN secret the loop serves /md/bars itself on localhost, so the
          # Trader's gold and forex feed no longer depends on the website (the outage of 15 Nov put every market on Kraken)
          if [ -n "$OANDA_TOKEN" ]; then
            (node council/md-proxy.mjs 8790 > md-proxy.log 2>&1 &)
            for t in $(seq 1 20); do curl -fs -o /dev/null "http://127.0.0.1:8790/md/bars?sym=xau&tf=1h&n=2" && break; sleep 0.5; done
            if curl -fs -o /dev/null "http://127.0.0.1:8790/md/bars?sym=xau&tf=1h&n=2"; then export MD_BASE=http://127.0.0.1:8790/md/ ICT_MD_BARS=http://127.0.0.1:8790/md/bars; echo "own OANDA candles on"; else echo "own OANDA candles did not answer: using the website's proxy"; fi
          fi
          git -C data config user.name "mosha-council"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ROUNDS=60
          # new council code on main since this run started? (council/, ict/, api/ or this workflow) -> hand over between rounds
          newcode() { f=$(gh api "repos/${{ github.repository }}/compare/${{ github.sha }}...main" --jq '.files[].filename' 2>/dev/null) || return 1
            echo "$f" | grep -qE '^(council/|ict/|api/|\.github/workflows/council\.yml)'; }
          # fast copy (26 Nov 2026, owner: "More speed"): the copied Equinox desks are read again (about 6 s) and, only when one holds
          # a fill first written in the last 3 minutes (council/copy-due.mjs, read only), the mirror runs at once. Called every 20 s
          # between quick passes and between a round's heavy members; it never fails the loop and is saved by the next save.
          # fastorder (27 Nov 2026, owner: "make sure the orders are faster"): the hourly rules (Nasdaq l1 / l5, USD/JPY morning
          # breakout, gold 8-swing break; demo and live) are read again inside every fastcopy during the first 12 minutes of an hour,
          # and the breakouts of the day during the first 20 minutes of a UTC day, so an order goes out within about 20 s of the
          # candle close instead of waiting for the next quick pass. Each job skips at once when nothing is due or it already looked.
          fastorder() { s=$(( $(date +%s) % 3600 )); if [ "$s" -ge 8 ] && [ "$s" -le 720 ]; then
              timeout 45 node council/nq-demo.mjs data --live >/dev/null 2>&1 || echo "Nasdaq live fast ($1) failed"
              timeout 45 node council/nq-demo.mjs data >/dev/null 2>&1 || echo "Nasdaq demo fast ($1) failed"; fi
            d=$(( $(date +%s) % 86400 )); if [ "$d" -le 1200 ]; then
              timeout 45 node council/vb-demo.mjs data --live >/dev/null 2>&1 || echo "Breakout live fast ($1) failed"
              timeout 45 node council/vb-demo.mjs data >/dev/null 2>&1 || echo "Breakout demo fast ($1) failed"; fi; }
          fastcopy() { fastorder "$1"; timeout 60 node council/edge-desks.mjs data --only fade,bigfade,boxfade,fvg,goldvb --live >/dev/null 2>&1 || echo "Copied desks ($1) failed"
            if timeout 15 node council/copy-due.mjs data; then timeout 120 node council/ctrader-mirror.mjs data || echo "cTrader mirror fast copy ($1) failed"; fi; }
          # nap (26 Nov 2026, owner: "More speed" again): 20 s, or less when a 5-minute candle closes sooner: it wakes 2 s after the
          # close, the moment a desk fill can first be read, so a copy goes out seconds after the candle instead of up to 20 s later.
          # it also wakes 9 s after the hour, so the hourly rules' orders go out at once (fastorder)
          nap() { b=$(( 300 - ( $(date +%s) - 2 ) % 300 )); h=$(( 3600 - ( $(date +%s) - 9 ) % 3600 )); [ "$h" -lt "$b" ] && b=$h; if [ "$b" -lt 20 ]; then sleep "$b"; else sleep 20; fi; }
          for i in $(seq 1 $ROUNDS); do
            # 60 rounds take ~5.6 h (~5.6 min each), longer than the 330-min job timeout, so the job was killed before "Start the
            # next run" (6 Nov 05:44: 79 min with no run until the cron watchdog restarted it). Stop at 300 min so the hand-off runs.
            if [ "$SECONDS" -gt 18000 ]; then echo "Time budget reached after $((i - 1)) rounds"; break; fi
            # council/datasync.mjs (9 Nov): pulls with the loop's uncommitted files riding along (a plain pull refused every minute:
            # "You have unstaged changes"), clears a half-done rebase, and on a conflict keeps the council-data copy of that file
            node council/datasync.mjs data pull || true
            # (17 Nov 2026: the never-installed VPS live runner and its heartbeat check are gone; this loop always runs the Trader)
            # The Equinox desks whose records are COPIED to demo accounts (26 Nov 2026, owner: "We need to fix these delays and late
            # entries"): read every round and every quick pass, BEFORE the Trader and the mirror, so a desk fill reaches its demo
            # account within about a minute (they were read every 3rd round, and the copies went out 17 to 42 minutes late). Paper
            # records only; about 6 s a run.
            timeout 60 node council/edge-desks.mjs data --only fade,bigfade,boxfade,fvg,goldvb --live || echo "Copied desks round $i failed"
            node council/trader.mjs data || echo "Trader round $i failed"
            # cTrader DEMO mirror (8 Nov, owner: "when he places a trade it must go instantly on ctrader"): the very next step after
            # the Trader, so a council fill or pending order reaches the demo within seconds of being recorded; nothing runs in between
            node council/ctrader-mirror.mjs data || echo "cTrader mirror round $i failed"
            # Volatility breakout on a DEMO account (council/vb-demo.mjs, 21 Nov 2026): gold and USD/JPY, the studies' T1. Looks at the
            # clock and its own record and connects only when the minute needs it; demo only; never fails or holds the round.
            timeout 45 node council/vb-demo.mjs data || echo "Breakout demo round $i failed"
            # H1 dominant-zone limit on the Council DEMO account (council/dom-demo.mjs, 23 Nov 2026): a forward demo record, label "dom";
            # reads H1 candles, connects only when an order is due or one of its own rests or is open; never fails or holds the round.
            timeout 45 node council/dom-demo.mjs data || echo "H1 DOM demo round $i failed"
            # gold only, 4R target, its own label and record (26 Nov 2026, owner: "yes do gold dom 4r on demo"); demo account only
            timeout 45 node council/dom-demo.mjs data --variant gold4r || echo "Gold DOM 4R demo round $i failed"
            # The two Nasdaq leads that passed at the broker's own ticks (l1, l5) on a DEMO account (council/nq-demo.mjs, 26 Nov 2026):
            # reads H1 candles once an hour, connects only on a signal or while one of its positions is open; every order has a stop.
            timeout 45 node council/nq-demo.mjs data || echo "Nasdaq demo round $i failed"
            # The LIVE account (council/live.mjs, owner 27 Nov 2026): the same rules (+ the gold 8-swing break) at config.live.risk,
            # its own records (live/), a daily stop; does nothing unless config.json live is on and CTRADER_LIVE=on
            timeout 45 node council/vb-demo.mjs data --live || echo "Breakout live round $i failed"
            timeout 45 node council/nq-demo.mjs data --live || echo "Nasdaq live round $i failed"
            # ICT desk (7 Nov): GitHub fired ict.yml's 15-min schedule only 3 times in 22 h, so the desk runs here, every 3rd
            # round (~17 min). ict.yml keeps a manual trigger only (one writer of ict/). Its A-setups get their own mirror pass
            # right after it, so they too reach the demo within seconds (the mirror is idempotent: a second pass sends nothing new).
            if [ $((i % 3)) -eq 1 ]; then node ict/tracker.mjs data/ict || echo "ICT round $i failed"; node council/ctrader-mirror.mjs data || echo "cTrader mirror (ICT) round $i failed"; fi
            # The Mosha desk's tracker (council/mosha-desk.mjs): a paper record of the desk's reading on gold, no order and no alert.
            if [ $((i % 3)) -eq 1 ]; then timeout 240 node council/mosha-desk.mjs data || echo "Mosha desk round $i failed"; fi
            fastcopy "round $i"
            # The LIT, Engulfing and MSNR desks' trackers (council/edge-desks.mjs): paper records of two readings, no order and no alert.
            if [ $((i % 3)) -eq 1 ]; then timeout 280 node council/edge-desks.mjs data --only eg,msnr,lit || echo "Edge desks round $i failed"; fi
            fastcopy "round $i"
            # The eight Equinox desks (23 Nov 2026, council/edge-desks-2.mjs, shown on /equinox): each study's own rule as a paper record, no order and no alert.
            # Own line and timeout (5-minute candles of eighteen markets, read once for the eight desks), so the older desks keep their 280 s.
            if [ $((i % 3)) -eq 1 ]; then timeout 150 node council/edge-desks.mjs data --only fade,bigfade,roundfade,boxfade,fvg,goldvb,jpyvb,nq1,zero,nq2,lyriac,dom || echo "Passing-edge desks round $i failed"; fi
            # Macro strategist (7 Nov, paper only): next-day odds, event playbook and scorecard → data/macro/; every 6th round
            # (~25 min), capped at 3 min; a failure never stops the loop.
            if [ $((i % 6)) -eq 1 ]; then timeout 180 node council/macro.mjs data || echo "Macro round $i failed"; fi
            # Hard-to-find data (20 Nov 2026): Cleveland Fed inflation nowcast, Atlanta Fed GDPNow, prediction-market Fed odds, the Fed's
            # calendar → data/macro/hard-data.json (keyless public sources; a failed one keeps its last copy); before the veteran reads it
            if [ $((i % 6)) -eq 1 ]; then timeout 240 node council/hard-data.mjs data || echo "Hard data round $i failed"; fi
            # Macro veteran (8 Nov, owner's gptmacro_v.1 skill as a council member, paper only): discusses the strategist's view from its
            # data (no fetches), keeps a weekly forecast ledger → data/macro/veteran*.json; runs right after the strategist
            if [ $((i % 6)) -eq 1 ]; then timeout 60 node council/veteran.mjs data || echo "Veteran round $i failed"; fi
            # COT positioning desk (8 Nov): CFTC speculators per market + tested signals → data/macro/cot.json (fetch cached 12 h)
            if [ $((i % 6)) -eq 1 ]; then timeout 90 node council/cot.mjs data || echo "COT round $i failed"; fi
            fastcopy "round $i"
            # Daily reports (19 Nov 2026, owner): the world-economy and markets reports, built once a London day from 06:00 from the
            # files above (fetches nothing) → data/macro/daily-report.json; the Worker announces them at 06:30. Every round, cheap.
            timeout 30 node council/daily-report.mjs data || echo "Daily report round $i failed"
            # Trade review (17 Nov): the after-the-fact check of the trades taken, system by system (n, t, where the R goes, costs,
            # demo slippage, session splits) and proposals only → data/research/trade-review.json. Reads files, fetches nothing,
            # changes no rule; ICT is not read. Every 6th round (~70 min), capped at 60 s; a failure never stops the loop.
            if [ $((i % 6)) -eq 1 ]; then timeout 60 node council/trade-review.mjs data || echo "Trade review round $i failed"; fi
            # Data-quality monitor (7 Nov): the OANDA proxy, Kraken and the ICT desk's CNBC feed, every 2nd round (~11 min) → health.json
            # and one deduplicated phone alert when a feed goes bad. Read-only for the bots; never fails the round.
            if [ $((i % 2)) -eq 1 ]; then timeout 150 node council/datacheck.mjs data || echo "Data check round $i failed"; fi
            fastcopy "round $i"
            # broker symbol specs (read only): lot size, min/step lot, quote currency, conversion, spread → ctrader/symbols.json,
            # which the mirror sizes its lots with and the Trader's cost model reads spreads from
            timeout 90 node council/ctrader-symbols.mjs data || echo "cTrader symbols round $i failed"
            node council/ctrader-test.mjs data || echo "cTrader test round $i failed"   # one-off demo test order, only when ctrader/test.json asks
            node council/ctrader-suite.mjs data || echo "cTrader suite round $i failed"   # demo trade test suite (latency, SL/TP, limit, cancel), only when ctrader/suite.json asks
            node council/ctrader-account.mjs data || echo "cTrader account round $i failed"   # the owner's demo account for the profile view (read only)
            # Daily owner digest (8 Nov): one phone message after the US close (from 21:15 UTC Mon-Fri) and a Sunday-evening
            # preview; deduplicated per UTC day in data/digest.json, so it does nothing on every other round. Never fails the round.
            timeout 120 node council/digest.mjs data || echo "Digest round $i failed"
            fastcopy "round $i"
            # Research ledger (8 Nov): one row per study in research/edge (verdict, headline, systems, PR) → research/ledger.json,
            # read by the site, the digest and the week pane. Every 3rd round, before the digest's round; a new study merged
            # while this run is up is also written at once by research-ledger.yml. Read only; never fails the round.
            if [ $((i % 3)) -eq 2 ]; then timeout 60 node council/research-ledger.mjs data || echo "Research ledger round $i failed"; fi
            # commit + push (3 tries): a conflicting file keeps the council-data copy (another writer or the owner touched it; this
            # loop rebuilds its own files next round), the rest of the round is saved, a JSON file that does not parse is never
            # committed, and nothing is left half-rebased (8 Nov: an abort alone left the clone diverged, every push was rejected)
            node council/datasync.mjs data save "Council run $(date -u +%Y-%m-%dT%H:%MZ)" || echo "Council data not pushed after round $i (next round retries)"
            # ICT replay trigger (11 Nov): ict-replay.yml has a daily cron, but GitHub fires this repository's schedules late or
            # not at all, so the desk could say "update pending" for days. After the round is saved, council/replay-due.mjs (read
            # only) says whether ict/replay.json is over 20 h old with no replay run active or started in the last 6 h; only then
            # main's ict-replay.yml is dispatched (its own concurrency group: never two at once). Not sure = no. Never fails the round.
            if timeout 45 node council/replay-due.mjs data; then timeout 30 gh workflow run ict-replay.yml --ref main -R "${{ github.repository }}" || echo "ICT replay not dispatched after round $i (a later round retries)"; fi
            # Gotobi trigger (20 Nov 2026): the gotobi job must be running before 00:55 UTC on a gotobi morning; GitHub's own cron can be
            # late and the Worker's timer has no token. council/gotobi-due.mjs (read only) says yes on a gotobi weekday 00:25-00:49 UTC
            # when no gotobi run is active or started in the last hour; then main's gotobi.yml is dispatched (its concurrency group
            # keeps one run). Never fails the round.
            if timeout 30 node council/gotobi-due.mjs; then timeout 30 gh workflow run gotobi.yml --ref main -R "${{ github.repository }}" || echo "Gotobi not dispatched after round $i (a later round retries)"; fi
            if newcode; then echo "New council code on main: handing over after round $i"; break; fi
            if [ "$i" -lt "$ROUNDS" ]; then
              for k in 1 2 3 4; do nap; fastcopy "wait $i"; nap; fastcopy "wait $i"; nap
                # Quick pass (8 Nov, owner: "start at 2 minutes", then "every minute"): every minute of the wait the Trader looks at the
                # markets again and the mirror copies what it recorded, so a setup reaches cTrader within about a minute. The heavy
                # members keep the 5-minute round. Saved as its own commit; a failure never stops the loop.
                node council/datasync.mjs data pull || true
                timeout 60 node council/edge-desks.mjs data --only fade,bigfade,boxfade,fvg,goldvb --live || echo "Copied desks quick pass $i failed"
                node council/trader.mjs data || echo "Trader quick pass $i failed"
                node council/ctrader-mirror.mjs data || echo "cTrader mirror quick pass $i failed"
                timeout 45 node council/vb-demo.mjs data || echo "Breakout demo quick pass $i failed"
                timeout 45 node council/dom-demo.mjs data || echo "H1 DOM demo quick pass $i failed"
                timeout 45 node council/dom-demo.mjs data --variant gold4r || echo "Gold DOM 4R demo quick pass $i failed"
                timeout 45 node council/nq-demo.mjs data || echo "Nasdaq demo quick pass $i failed"
                timeout 45 node council/vb-demo.mjs data --live || echo "Breakout live quick pass $i failed"
                timeout 45 node council/nq-demo.mjs data --live || echo "Nasdaq live quick pass $i failed"
                node council/datasync.mjs data save "Council quick pass $(date -u +%Y-%m-%dT%H:%MZ)" || echo "Quick pass $i not pushed"
                # the owner's demo account every minute between rounds (owner, 7 Nov: a manual trade showed up late); saved only on a change
                node council/ctrader-account.mjs data >/dev/null 2>&1 || true
                if ! git -C data diff --quiet -- ctrader/account.json 2>/dev/null || [ -n "$(git -C data ls-files --others -- ctrader/account.json)" ]; then
                  # with accounts.json too: it changes on every call (its `at`); left uncommitted it blocked every later pull
                  node council/datasync.mjs data save "cTrader account $(date -u +%H:%MZ)" ctrader/account.json ctrader/accounts.json || true
                fi
                if newcode; then echo "New council code on main: handing over after round $i"; break 2; fi
              done
            fi
          done

      - name: Start the next run
        # also after a failed Trade step (never after a cancel: the cron watchdog or a person cancelled it on purpose); one failed
        # dispatch call used to leave the loop dead until GitHub fired the cron, which it does a few times a day here
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: for a in 1 2 3; do gh workflow run council.yml --ref main -R "${{ github.repository }}" && exit 0; sleep 10; done; echo "::warning::could not dispatch the next run"; exit 1
