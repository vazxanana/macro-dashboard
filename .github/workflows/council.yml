name: Council trader

# Paper-trades every Mosha setup on all markets every 15 minutes and runs the
# daily statistical Coach. Results go to the `council-data` branch (never main,
# so Pages doesn't redeploy every run); the market-structure page reads them.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  # also run right away whenever the trader code changes on main
  push:
    branches: [main]
    paths:
      - 'council/**'
      - '.github/workflows/council.yml'

permissions:
  contents: write

concurrency:
  group: council
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: council

      - name: Checkout council data
        uses: actions/checkout@v4
        with:
          ref: council-data
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run trader and coach
        run: node council/trader.mjs data

      - name: Save results
        working-directory: data
        run: |
          git config user.name "mosha-council"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "Council run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase origin council-data && git push -q origin HEAD:council-data && break; sleep 5; done
