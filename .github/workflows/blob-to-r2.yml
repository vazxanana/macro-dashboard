name: Copy Vercel Blob to R2

# One-time copy of the Vercel Blob store (users, profiles, notices, sounds, price alerts, Mosha log and lessons, Academy store)
# into the Cloudflare R2 bucket meridianx-blob, same keys (scripts/blob-to-r2.mjs; docs/cloudflare.md). Run by hand only.
# The copied files hold password hashes: they are never uploaded as an artifact and are deleted at the end.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the secrets
        run: |
          set +x
          missing=""
          [ -n "$BLOB_READ_WRITE_TOKEN" ] || missing="$missing BLOB_READ_WRITE_TOKEN"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Secrets missing::Add the repository secrets:$missing (Settings -> Secrets and variables -> Actions). See docs/cloudflare.md."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the functions' dependencies
        run: npm ci --no-audit --no-fund

      - name: Create the R2 bucket if missing
        run: |
          set +x
          npx --yes wrangler@4.140.0 r2 bucket create meridianx-blob > r2.log 2>&1 || grep -qiE 'already exists|already own|10004' r2.log || { cat r2.log; exit 1; }
          rm -f r2.log

      - name: Export from Vercel Blob
        run: node scripts/blob-to-r2.mjs export "$RUNNER_TEMP/blob-copy"

      - name: Import into R2
        run: node scripts/blob-to-r2.mjs import "$RUNNER_TEMP/blob-copy"

      - name: Delete the copied files
        if: always()
        run: rm -rf "$RUNNER_TEMP/blob-copy"
