name: Council data probe
# RESEARCH ONLY: 1-minute history from HistData.com for out-of-sample tests of the Mosha BO system (other markets).
on:
  push:
    branches: [council-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pair: [XAGUSD, EURUSD, GBPUSD, USDJPY]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: council-data, path: data }
      - name: HistData 1m ${{ matrix.pair }}
        run: |
          D=data/research/candles/${{ matrix.pair }}; mkdir -p $D
          python3 tools/histdata.py $D ${{ matrix.pair }} || true
          ls -la $D
          git -C data config user.name "mosha-council"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C data add research/candles && git -C data commit -qm "Probe: HistData 1m ${{ matrix.pair }}" || exit 0
          for j in 1 2 3 4 5 6 7 8; do git -C data pull -q --rebase origin council-data && git -C data push -q origin HEAD:council-data && break; sleep $((5*j)); done
