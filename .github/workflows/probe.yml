name: Council data probe
# RESEARCH ONLY: index 1m (S&P 500, Nasdaq 100) 1m history from HistData.com to council-data/research/candles/xau-histdata/.
on:
  push:
    branches: [council-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: council-data, path: data }
      - name: CNBC spot gold (XAU=) 1m history + live delay
        run: |
          D=data/research/probe/cnbc-gc; mkdir -p $D
          for sym in "%40GC.1"; do
            n=$(echo $sym | tr -dc 'A-Za-z0-9'); now=$(TZ=America/New_York date +%Y%m%d%H%M%S)
            curl -sS -A "Mozilla/5.0" -m 60 -o $D/$n-live.json "https://ts-api.cnbc.com/harmony/app/bars/$sym/1M/$(TZ=America/New_York date -d '-3 hours' +%Y%m%d%H%M%S)/$now/adjusted/EST5EDT.json" || true
            echo "$n live fetched at $(date -u +%FT%TZ)" >> $D/when.txt
          done
          d=2026-01-01
          while [ "$d" \< "$(date -u +%F)" ]; do e=$(date -u -d "$d +14 days" +%F)
            curl -sS -A "Mozilla/5.0" -m 90 -o $D/gc-${d//-/}.json "https://ts-api.cnbc.com/harmony/app/bars/%40GC.1/1M/${d//-/}000000/${e//-/}000000/adjusted/EST5EDT.json" || true
            sleep 2; d=$e; done
          ls -la $D; gzip -9f $D/*.json
          git -C data config user.name "mosha-council"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C data add research/probe && git -C data commit -qm "Probe: CNBC COMEX gold @GC.1 1m $(date -u +%H:%MZ)" || exit 0
          for j in 1 2 3 4 5; do git -C data pull -q --rebase origin council-data && git -C data push -q origin HEAD:council-data && break; sleep 5; done
