name: Council data probe
# RESEARCH ONLY: Binance daily candles 2017-2026 for the crypto trend-following check (council pairs).
on:
  push:
    branches: [council-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: council-data, path: data }
      - name: Binance daily candles
        run: |
          D=data/research/candles/crypto1d; mkdir -p $D
          python3 tools/binance1d.py $D BTCUSDT ETHUSDT XRPUSDT SOLUSDT BNBUSDT ADAUSDT LTCUSDT LINKUSDT DOGEUSDT TRXUSDT || true
          ls -la $D
          git -C data config user.name "mosha-council"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C data add research/candles && git -C data commit -qm "Probe: Binance daily candles 2017-2026" || exit 0
          for j in 1 2 3 4 5 6; do git -C data pull -q --rebase origin council-data && git -C data push -q origin HEAD:council-data && break; sleep $((5*j)); done
