name: Council data probe
# RESEARCH ONLY (owner 7 Nov: crypto scalper on more IC Markets coins): Binance spot 5m klines 2022 - Oct 2026.
on:
  push:
    branches: [council-probe]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        sym: [LTCUSDT, BCHUSDT, ADAUSDT, DOGEUSDT, DOTUSDT, LINKUSDT, XLMUSDT, AVAXUSDT, UNIUSDT, EOSUSDT, DASHUSDT]
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out && python3 tools/binance5m.py out ${{ matrix.sym }} 2022
      - uses: actions/upload-artifact@v4
        with: { name: '${{ matrix.sym }}', path: 'out/*.json.gz' }
  save:
    needs: dump
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: council-data }
      - uses: actions/download-artifact@v4
        with: { path: dl, merge-multiple: true }
      - run: |
          mkdir -p research/candles/crypto5m && mv dl/*.json.gz research/candles/crypto5m/ && ls -la research/candles/crypto5m
          git config user.name "mosha-council"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/candles/crypto5m && git commit -qm "Research: more IC Markets coins, Binance 5m 2022-2026 (crypto scalper)" || exit 0
          for j in 1 2 3 4 5; do git pull -q --rebase origin council-data && git push -q origin HEAD:council-data && break; sleep 5; done
