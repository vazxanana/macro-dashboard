name: Council data probe
# RESEARCH ONLY: checks which keyless NQ intraday feeds answer GitHub's runners; writes to council-data/research/probe/.
on:
  push:
    branches: [council-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: council-data, path: data }
      - name: Probe NQ feeds
        run: |
          mkdir -p data/research/probe
          curl -sS -A "Mozilla/5.0" -m 30 -o data/research/probe/cnbc-nd-20261104.json "https://ts-api.cnbc.com/harmony/app/bars/@ND.1/1M/20261103160000/20261104120000/adjusted/EST5EDT.json"
          ls -la data/research/probe
          git -C data config user.name "mosha-council"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C data add research/probe && git -C data commit -qm "Probe: CNBC ND 1m 4 Nov $(date -u +%H:%MZ)" || exit 0
          for j in 1 2 3 4 5; do git -C data pull -q --rebase origin council-data && git -C data push -q origin HEAD:council-data && break; sleep 5; done
