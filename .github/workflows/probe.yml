name: Council data probe
# RESEARCH ONLY: fetches raw candles for local research; writes to council-data/research/.
on:
  push:
    branches: [council-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: council-data, path: data }
      - name: Fetch
        run: |
          # Is the live site serving the new calendar?
          mkdir -p data/research/probe
          { for u in "https://vazxanana.github.io/macro-dashboard/market-structure.html" "https://vazxanana.github.io/macro-dashboard/gold-trading.html" "https://vazxanana.github.io/macro-dashboard/"; do
              code=$(curl -sS -o /tmp/p.html -w "%{http_code}" "$u?nocache=$(date +%s)"); echo "$u $code bytes=$(wc -c </tmp/p.html) cal-seg=$(grep -c 'cal-seg' /tmp/p.html) ms-cal-rp=$(grep -c 'ms-cal-rp' /tmp/p.html) council=$(grep -ci 'council' /tmp/p.html) ms-link=$(grep -c 'market-structure' /tmp/p.html)"; done
            curl -sSI "https://vazxanana.github.io/macro-dashboard/market-structure.html" | grep -i "last-modified\|cache-control\|age:"
            curl -sS "https://raw.githubusercontent.com/vazxanana/macro-dashboard/council-data/research/replay-2w.json" | head -c 120; echo
          } | tee data/research/probe/site-check.txt
          git -C data config user.name "mosha-council"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C data add research/probe && git -C data commit -qm "Probe: live site check $(date -u +%H:%MZ)" || exit 0
          for j in 1 2 3 4 5; do git -C data pull -q --rebase origin council-data && git -C data push -q origin HEAD:council-data && break; sleep 5; done
