name: Council data probe
# RESEARCH ONLY: fetches raw candles for local research; writes to council-data/research/.
on:
  push:
    branches: [council-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: council-data, path: data }
      - name: Fetch
        run: |
          # Fresh Kraken PAXG candles to replay the gold replica against what the live Trader recorded
          mkdir -p data/research/probe
          for iv in 1 5 15 60; do curl -sS "https://api.kraken.com/0/public/OHLC?pair=PAXGUSD&interval=$iv" -o "data/research/probe/PAXG-$iv.json"; sleep 2; done
          curl -sS "https://api.gold-api.com/price/XAU" -o data/research/probe/spot.json
          git -C data config user.name "mosha-council"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C data add research/probe && git -C data commit -qm "Probe: Kraken PAXG candles $(date -u +%H:%MZ)" || exit 0
          for j in 1 2 3 4 5; do git -C data pull -q --rebase origin council-data && git -C data push -q origin HEAD:council-data && break; sleep 5; done
