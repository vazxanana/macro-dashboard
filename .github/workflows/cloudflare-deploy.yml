name: Cloudflare deploy

# Deploys cloudflare/ (the Worker, docs/cloudflare.md) with out/ as its assets: the workers.dev address and the
# two custom domains of wrangler.jsonc `routes` (aureumdesk.co.uk, www). It does not touch DNS and sets no
# Worker secrets: those are copied by the owner with `wrangler secret put` (docs/cloudflare.md, stage 2).
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   an API token with "Workers Scripts: Edit" on the account
#   CLOUDFLARE_ACCOUNT_ID  the account's id
#
# Runs by hand (Actions -> Cloudflare deploy -> Run workflow), and on a push to the Cloudflare branches
# that changes the Worker, the site build or this file. Never on main until the move is approved stage by stage.

on:
  workflow_dispatch:
  push:
    branches: [claude/cloudflare-stage1, claude/relaxed-albattani-8c6aky]
    paths:
      - 'cloudflare/**'
      - 'out/**'
      - 'api/**'
      - 'vercel.json'
      - 'academy/**'
      - 'ml/models/**'
      - 'mt5/**'
      - 'ctrader/**'
      - '.github/workflows/cloudflare-deploy.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the two secrets are set
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them, then re-run this job."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Worker's packages
        working-directory: cloudflare
        run: npm ci --no-audit --no-fund

      - name: Language-model settings on the Worker (names and types only; never a secret's value)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          j=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/meridianx/settings") || true
          echo "$j" | jq -r 'if .success then (.result.bindings[] | select(.name | test("^(ACADEMY_LLM|EDGE_|TRADE_REVIEW|CHRONOS_)")) | "\(.name)  \(.type)" + (if .type == "plain_text" and (.name | test("KEY") | not) then "  = \(.text)" else "" end)) else "could not read the Worker settings: \(.errors)" end' || true
          for n in ACADEMY_LLM_KEY ACADEMY_LLM_URL ACADEMY_LLM_MODEL ACADEMY_LLM_FORMAT ACADEMY_LLM_USD_PER_MTOK_IN ACADEMY_LLM_USD_PER_MTOK_OUT; do
            echo "$j" | jq -e --arg n "$n" '.result.bindings[] | select(.name == $n)' >/dev/null 2>&1 || echo "::warning::$n is not set on the Worker"
          done
          echo "$j" | jq -e '.result.bindings[] | select(.name == "ACADEMY_LLM_KEY" and .type == "plain_text")' >/dev/null 2>&1 && echo "::warning::ACADEMY_LLM_KEY is plain text: delete it and add it again as a Secret" || true

      - name: Deploy
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: First look at the deployed site
        if: success()
        run: |
          base="https://aureumdesk.co.uk"
          sleep 10
          fail=0
          for p in / /market-structure.html /macro-desk /backtest /gold /api/status /cdata/trades.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$base$p" || echo 000)
            echo "$code  $p"
            case "$code" in 2*) ;; *) fail=1 ;; esac
          done
          [ "$fail" = 0 ] || echo "::warning::Some addresses did not answer 2xx (expected for API calls until the Worker's secrets are set)."
