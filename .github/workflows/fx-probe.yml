name: FX feed probe
on:
  push:
    branches: [claude/website-display-xoyadz]
    paths: ['.github/workflows/fx-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe forex endpoints
        run: |
          probe() {
            echo "=== $1"
            curl -s -m 20 -D /tmp/h -o /tmp/b -H "Origin: https://vazxanana.github.io" "$1"
            head -1 /tmp/h; grep -i "access-control-allow-origin" /tmp/h || echo "(no ACAO header)"
            head -c 400 /tmp/b; echo; echo
          }
          for p in EURUSD GBPUSD USDJPY AUDUSD ZEURZUSD ZGBPZUSD ZUSDZJPY USDCAD USDCHF EURGBP; do probe "https://api.kraken.com/0/public/OHLC?pair=$p&interval=60"; done
          echo "=== Kraken fiat pairs"; curl -s -m 20 "https://api.kraken.com/0/public/AssetPairs" | python3 -c "import sys,json; d=json.load(sys.stdin)['result']; print([ (k,v['altname'],v.get('wsname')) for k,v in d.items() if all(x in ['ZUSD','ZEUR','ZGBP','ZJPY','ZCAD','CHF','ZAUD','AUD','USD','EUR','GBP','JPY'] for x in [v['base'],v['quote']]) ])"
          for s in EURUSDT GBPUSDT AUDUSDT EURIUSDT; do probe "https://api.binance.com/api/v3/klines?symbol=$s&interval=1h&limit=2"; done
          for s in eurusd gbpusd; do probe "https://www.bitstamp.net/api/v2/ohlc/$s/?step=3600&limit=2"; done
          for s in USDT-EUR USDC-EUR USDT-GBP USDC-GBP; do probe "https://api.exchange.coinbase.com/products/$s/candles?granularity=3600"; done
          probe "https://api.frankfurter.app/latest?from=USD&to=JPY,EUR,GBP,AUD"
