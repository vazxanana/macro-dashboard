name: Forward records (research)

# Weekdays, free: the forward records of gold-vol-breakout's T1, gold-pre-holiday's T1, turnaround-tuesday's R2 on NAS100 and T1 on USD/JPY,
# and vb-early-forward's split of the gold and USD/JPY T1 trades by fill hour (their PREREGISTRATION.md under
# research/edge/*-forward) on OANDA mid M5 / H1 candles, saved to council-data research/forward/gold-vol-breakout.json,
# gold-pre-holiday.json, turnaround-tuesday.json, usdjpy-vol-breakout.json and vb-early.json. Paper research only: nothing is traded,
# alerted or copied and no council member reads the files. The previous file is read back so the first crossing of a
# checkpoint stands.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 2-6'   # Tuesday-Saturday 04:41 UTC (a day appears once a later day has candles)

permissions:
  contents: write

concurrency:
  group: vb-forward
  cancel-in-progress: false

env:
  MD_BASE: ${{ format('{0}/md/', vars.MD_ORIGIN || 'https://aureumdesk.co.uk') }}

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout council data (the forward file only)
        uses: actions/checkout@v4
        with:
          ref: council-data
          path: data
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/forward/*

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Own OANDA candles (no website needed; scripts/own-candles.sh)
        env:
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
          OANDA_ENV: ${{ secrets.OANDA_ENV }}
        run: sh scripts/own-candles.sh

      - name: Candles and the forward record
        env:
          GGO_FROM: '2026-10-01T00:00:00Z'
        run: |
          mkdir -p "$RUNNER_TEMP/c" data/research/forward
          # up to now, not to midnight: a day counts once a later day has candles (PREREGISTRATION.md); stopping at midnight
          # left the last complete day out (the 20 Nov run read through 18 Nov)
          GGO_TO="$(date -u +%Y-%m-%dT%H:%M:%SZ)" node research/edge/gold-gap-open/fetch.mjs "$RUNNER_TEMP/c"
          node research/edge/gold-vol-breakout-forward/run.mjs "$RUNNER_TEMP/c" data/research/forward/gold-vol-breakout.json

      - name: Gold before US holidays, the forward record
        if: ${{ !cancelled() }}   # one record's failure never costs the others their save (the job still ends red)
        run: |
          node research/edge/gold-pre-holiday-forward/run.mjs fetch "$RUNNER_TEMP/h"
          node research/edge/gold-pre-holiday-forward/run.mjs run "$RUNNER_TEMP/h" data/research/forward/gold-pre-holiday.json

      - name: Turnaround Tuesday on NAS100, the forward record
        if: ${{ !cancelled() }}   # one record's failure never costs the others their save (the job still ends red)
        run: |
          node research/edge/turnaround-tuesday-forward/run.mjs fetch "$RUNNER_TEMP/t"
          node research/edge/turnaround-tuesday-forward/run.mjs run "$RUNNER_TEMP/t" data/research/forward/turnaround-tuesday.json

      - name: USD/JPY breakout, the forward record
        if: ${{ !cancelled() }}   # one record's failure never costs the others their save (the job still ends red)
        run: |
          node research/edge/usdjpy-vol-breakout-forward/run.mjs fetch "$RUNNER_TEMP/u"
          node research/edge/usdjpy-vol-breakout-forward/run.mjs run "$RUNNER_TEMP/u" data/research/forward/usdjpy-vol-breakout.json

      - name: GBP/JPY breakout, the forward record
        if: ${{ !cancelled() }}   # one record's failure never costs the others their save (the job still ends red)
        run: |
          node research/edge/gbpjpy-vol-breakout-forward/run.mjs fetch "$RUNNER_TEMP/g"
          node research/edge/gbpjpy-vol-breakout-forward/run.mjs run "$RUNNER_TEMP/g" data/research/forward/gbpjpy-vol-breakout.json

      - name: Early against late fills of the two breakouts, the forward split
        if: ${{ !cancelled() }}   # one record's failure never costs the others their save (the job still ends red)
        # the gold and USD/JPY candles the two steps above fetched; nothing is fetched again
        run: node research/edge/vb-early-forward/run.mjs run "$RUNNER_TEMP/c" "$RUNNER_TEMP/u" data/research/forward/vb-early.json

      - name: EUR/JPY engulf-retest sell, the forward record
        if: ${{ !cancelled() }}
        run: |
          node research/edge/eurjpy-egr-forward/run.mjs fetch "$RUNNER_TEMP/e"
          node research/edge/eurjpy-egr-forward/run.mjs run "$RUNNER_TEMP/e" data/research/forward/eurjpy-egr.json

      - name: Gotobi fade (T2), the forward record
        if: ${{ !cancelled() }}   # one record's failure never costs the others their save (the job still ends red)
        run: |
          node research/edge/gotobi-forward/run.mjs fetch "$RUNNER_TEMP/g"
          node research/edge/gotobi-forward/run.mjs run "$RUNNER_TEMP/g" data/research/forward/gotobi.json

      - name: Save
        if: ${{ !cancelled() }}   # one record's failure never costs the others their save (the job still ends red)
        run: |
          git -C data config user.name "mosha-council"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C data add research/forward
          git -C data commit -q -m "Forward records $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for j in 1 2 3 4 5; do git -C data pull -q --rebase origin council-data && git -C data push -q origin HEAD:council-data && break; sleep 7; done
